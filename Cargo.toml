[package]
name = "burn-speech-training"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
license = "(MIT OR Apache-2.0) AND BSD-2-Clause"
description = "Speech model training on Burn: MFCC features, CTC training on LibriSpeech, pronunciation scoring on SpeechOcean762"
repository = "https://github.com/dnvt/burn-speech-training"
keywords = ["burn", "speech", "ctc", "mfcc", "training"]
categories = ["science", "multimedia::audio"]
readme = "README.md"
documentation = "https://docs.rs/burn-speech-training"
include = [
    "/src",
    "/examples",
    "/LICENSE*",
    "/README.md",
    "/CHANGELOG.md",
]

[features]
default = ["flex", "cli"]
# Backends. Several can be enabled; the default device is the first available
# of cuda, wgpu, flex (override with the BURN_DEVICE environment variable).
flex = ["burn/flex"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
# Loss functions, schedules and inputs from the experiment log that did not
# beat the baseline recipe. See src/experiments/.
experiments = []
# The `burn-speech` command-line tool.
cli = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
burn = { version = "0.22.0", default-features = false, features = ["std", "optim"] }
symphonia = { version = "0.6", default-features = false, features = ["flac", "pcm", "wav"] }
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
tracing = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

[package.metadata.docs.rs]
features = ["experiments"]

[[bin]]
name = "burn-speech"
required-features = ["cli"]

# Burn's CPU kernels are very slow without optimisation; optimise
# dependencies in debug builds so `cargo test` stays fast.
[profile.dev.package."*"]
opt-level = 2
